# SignalSafe's C ABI over ringrtc's `native` API (the layer Signal Desktop's Electron binding,
# src/rust/src/electron.rs, wraps with Neon). Built as a dynamic library so ringrtc's Rust
# std and its libsignal v0.99 dependency stay separate from the app's libsignal.
[package]
name = "signal-ringrtc-ffi"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[lib]
name = "signal_ringrtc"
crate-type = ["cdylib", "lib"]

[dependencies]
ringrtc = { path = "../../../vendor/ringrtc/src/rust", features = ["native", "prebuilt_webrtc"] }
anyhow = "1.0.100"
base64 = "0.23.0"
log = { version = "0.4.29", features = ["std"] }
rand = { version = "0.10.2", features = ["sys_rng"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
strum = { version = "0.28.0", features = ["derive"] }

[workspace]
